<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AL Torrent Tools</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #121212; color: #eee; }
    header { padding: 12px 20px; background: #1f1f1f; }
    nav a { color: #9ad1ff; margin-right: 16px; text-decoration: none; }
    main { padding: 20px; }
    .card { background: #1b1b1b; border: 1px solid #333; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(280px, 1fr)); gap: 12px; }
    .grid > .card { min-width: 0; overflow: hidden; }
    .jobs-live-grid {
      display: grid;
      grid-template-columns: 1fr 3fr;
      gap: 12px;
    }
    .jobs-live-grid > .card { min-width: 0; overflow: hidden; }
    @media (max-width: 900px) {
      .jobs-live-grid { grid-template-columns: 1fr; }
    }
    .jobs-catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }
    .job-catalog-card h3 { color: #9ad1ff; font-size: 1.05rem; }
    .job-card-meta { margin: 0 0 8px; font-size: 0.9rem; }
    .job-meta-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0;
      min-width: 0;
    }
    .job-meta-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      color: #9b9b9b;
    }
    .job-meta-icon svg { width: 16px; height: 16px; fill: currentColor; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn { background: #2c4f76; color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      line-height: 0;
    }
    .btn-icon svg { width: 18px; height: 18px; fill: currentColor; }
    .col-download { width: 48px; text-align: center; }
    .btn-secondary { background: #3a3a3a; }
    .btn-danger { background: #823b3b; }
    .input, select, textarea { width: 100%; background: #101010; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border-bottom: 1px solid #343434; padding: 8px; text-align: left; vertical-align: top; overflow-wrap: anywhere; word-break: break-word; }
    .log-toolbar { justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; }
    .log-toolbar h3 { margin: 0; }
    .log-panel {
      max-height: 70vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: #101010;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .log-line {
      display: flex;
      gap: 8px;
      padding: 2px 0;
      border-bottom: 1px solid #1f1f1f;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }
    .log-line:last-child { border-bottom: 0; }
    .log-ts { color: #8a8a8a; flex: 0 0 auto; white-space: nowrap; }
    .log-level { flex: 0 0 56px; text-transform: lowercase; color: #9ad1ff; }
    .log-msg {
      flex: 1 1 0;
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .log-level-error { color: #ff8a80; }
    .log-level-warning { color: #ffcc80; }
    .log-level-debug { color: #6a6a6a; }
    .copy-status { font-size: 0.85rem; color: #8dffb0; }
    .muted { color: #9b9b9b; }
    .row { display: flex; gap: 8px; align-items: center; }
    .settings-group h2 { margin: 0 0 12px; font-size: 1.1rem; color: #9ad1ff; }
    .settings-group .grid { margin-top: 8px; }
    .settings-hint { display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; width: fit-content; }
    .badge-ok { background: #1f3d2a; color: #8dffb0; }
    .badge-warn { background: #3d2f1f; color: #ffcc80; }
    .badge-danger { background: #3d1f1f; color: #ff8a80; }
    .badge-muted { background: #2a2a2a; color: #9b9b9b; }
    .job-status-running, .job-status-discovered, .job-status-waiting_master, .job-status-waiting_slave, .job-status-master_added, .job-status-master_complete, .job-status-slave_added { color: #ffcc80; }
    .job-status-stopping { color: #ffcc80; opacity: 0.85; }
    .job-status-success, .job-status-done { color: #8dffb0; }
    .job-status-failed, .job-status-error { color: #ff8a80; }
    .job-status-cancelled, .job-status-pending { color: #9b9b9b; }
    .tg-status-skipped { color: #9b9b9b; }
    .tg-status-pending, .tg-status-queued { color: #ffcc80; }
    .tg-status-sent { color: #8dffb0; }
    .master-state-downloading { color: #9ad1ff; }
    .master-state-seeding { color: #8dffb0; }
    .master-state-stopped { color: #ffcc80; }
    .master-state-error { color: #ff8a80; }
    .master-state-missing, .master-state-unavailable { color: #9b9b9b; }
    .gl-pipeline {
      display: flex;
      align-items: center;
      gap: 0;
      list-style: none;
      margin: 0;
      padding: 0;
      flex-wrap: nowrap;
    }
    .gl-pipeline-sm .gl-stage-label { font-size: 0.65rem; }
    .gl-pipeline-sm .gl-stage { min-width: 36px; }
    .gl-pipeline-sm .gl-stage-connector { flex-basis: 8px; margin-bottom: 14px; }
    .gl-pipeline-lg .gl-stage-label { font-size: 0.85rem; }
    .gl-pipeline-lg { margin-bottom: 14px; }
    .gl-pipeline-detail-head {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .gl-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 52px;
    }
    .gl-pipeline-lg .gl-stage { min-width: 72px; }
    .gl-stage-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #666;
      background: #1b1b1b;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      color: transparent;
    }
    .gl-pipeline-lg .gl-stage-dot { width: 18px; height: 18px; font-size: 13px; }
    .gl-stage-label { color: #9b9b9b; line-height: 1.1; }
    .gl-stage-connector {
      flex: 0 0 18px;
      height: 2px;
      background: #444;
      margin: 0 2px 16px;
      list-style: none;
      align-self: flex-start;
    }
    .gl-pipeline-lg .gl-stage-connector { flex-basis: 28px; margin-bottom: 18px; }
    .gl-stage-pending .gl-stage-dot { border-color: #555; background: #222; }
    .gl-stage-pending .gl-stage-label { color: #666; }
    .gl-stage-running .gl-stage-dot {
      border-color: #1f75cb;
      background: #1f75cb;
      animation: gl-stage-pulse 1.2s ease-in-out infinite;
    }
    .gl-stage-running .gl-stage-label { color: #9ad1ff; }
    .gl-stage-success .gl-stage-dot { border-color: #2da160; background: #2da160; }
    .gl-stage-success .gl-stage-label { color: #8dffb0; }
    .gl-stage-failed .gl-stage-dot {
      border-color: #ec5941;
      background: #ec5941;
      color: #fff;
    }
    .gl-stage-failed .gl-stage-label { color: #ff8a80; }
    .gl-stage-cancelled .gl-stage-dot {
      border-color: #888;
      background: #555;
      color: #ddd;
    }
    .gl-stage-cancelled .gl-stage-label { color: #9b9b9b; }
    .gl-pipeline-status-text { display: block; font-size: 0.75rem; margin-top: 4px; }
    .pipeline-list-table { width: 100%; table-layout: fixed; }
    .pipeline-list-table th, .pipeline-list-table td {
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pipeline-list-id { width: 14rem; white-space: normal; }
    .pipeline-list-hash {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      word-break: break-all;
      line-height: 1.25;
      margin-top: 2px;
    }
    .pipeline-list-release { width: 24%; }
    .pipeline-list-torrent { width: 24%; }
    .pipeline-list-graph { width: 40%; overflow: visible; }
    @keyframes gl-stage-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(31, 117, 203, 0.55); }
      50% { box-shadow: 0 0 0 5px rgba(31, 117, 203, 0); }
    }
    tr.row-selected td { background: #243044; }
    a { color: #9ad1ff; }
    code { background: #101010; padding: 2px 6px; border-radius: 4px; }
    .release-block {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .release-summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: baseline;
      justify-content: space-between;
      padding: 14px 16px;
      user-select: none;
    }
    .release-summary::-webkit-details-marker { display: none; }
    .release-summary::before {
      content: "▸";
      color: #9ad1ff;
      margin-right: 8px;
      flex: 0 0 auto;
    }
    details[open] > .release-summary::before { content: "▾"; }
    .release-title { display: flex; flex-direction: column; gap: 2px; flex: 1 1 220px; min-width: 0; }
    .release-name-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .release-meta { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 0.9rem; }
    .release-body { padding: 0 16px 16px; border-top: 1px solid #2a2a2a; }
    .genre-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .genre-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      line-height: 1.4;
      background: #243044;
      color: #b8d4f0;
      border: 1px solid #354a66;
    }
    .member-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .member-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      line-height: 1.4;
      border: 1px solid transparent;
    }
    .member-tag--voicing { background: #1a3d3a; color: #7fd4c8; border-color: #2a5c56; }
    .member-tag--editing { background: #3d321a; color: #e8c07a; border-color: #5c4a2a; }
    .member-tag--timing { background: #1f3d2a; color: #8dffb0; border-color: #2f5c3d; }
    .member-tag--translating { background: #1a2e4a; color: #8bb8f0; border-color: #2a4a6e; }
    .member-tag--decorating { background: #3d2420; color: #f0a090; border-color: #5c3830; }
    .member-tag--poster { background: #2a2e36; color: #c0c8d4; border-color: #3d4450; }
    .member-tag--unknown { background: #2a2a2a; color: #9b9b9b; border-color: #3a3a3a; }
    .info-table { width: 100%; table-layout: auto; }
    .info-table th {
      width: 140px;
      color: #9b9b9b;
      font-weight: normal;
      border-bottom: 1px solid #2a2a2a;
      white-space: nowrap;
    }
    .info-table td { border-bottom: 1px solid #2a2a2a; }
    .info-table tr:last-child th,
    .info-table tr:last-child td { border-bottom: 0; }
    .pipeline-timeline {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pipeline-timeline-item {
      border-left: 2px solid #354a66;
      padding: 0 0 2px 12px;
    }
    .pipeline-timeline-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }
    .pipeline-timeline-message { margin-bottom: 4px; }
    .pipeline-timeline-links { font-size: 0.85rem; }
    .pipeline-event-details { margin-top: 4px; }
    .pipeline-event-details pre {
      margin: 6px 0 0;
      padding: 8px;
      background: #101010;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.82rem;
      white-space: pre-wrap;
    }
    tr.torrent-files-row td {
      padding-top: 0;
      border-bottom: 1px solid #343434;
    }
    .torrent-files {
      margin: 0 0 8px;
      padding: 6px 10px 8px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
    }
    .torrent-files summary { cursor: pointer; }
    .file-list {
      margin: 6px 0 0;
      padding-left: 16px;
      font-size: 0.9em;
      list-style: disc;
    }
    .file-list li { margin: 2px 0; }
    .file-list .file-download {
      display: inline-flex;
      vertical-align: middle;
      margin-left: 4px;
      color: #9ad1ff;
      text-decoration: none;
    }
    .file-list .file-download:hover { color: #c5e4ff; }
    .file-list .file-download svg { width: 14px; height: 14px; fill: currentColor; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Главная</a>
      <a href="/info">Информация</a>
      <a href="/settings">Настройки</a>
      <a href="/jobs">Джобы</a>
      <a href="/releases">Релизы</a>
      <a href="/archive">Архив</a>
      <a href="/pipeline">Пайплайн</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
  function formatLocalTimes(root) {
    const scope = root || document;
    scope.querySelectorAll("time.local-time[datetime]").forEach((el) => {
      const raw = el.getAttribute("datetime");
      if (!raw) return;
      const date = new Date(raw);
      if (Number.isNaN(date.getTime())) return;
      el.textContent = date.toLocaleString(undefined, {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
      });
      el.title = date.toString();
    });
  }
  const _downloadCheckQueue = [];
  let _downloadCheckBusy = false;
  const _DOWNLOAD_ICON =
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.2l3.6-3.6L17 11l-5 5-5-5 1.4-1.4L11 13.2V3h1zM5 19h14v2H5v-2z"/></svg>';

  function enqueueDownloadableChecks(root) {
    const scope = root || document;
    scope.querySelectorAll(".torrent-files[data-download-check]:not([data-download-queued])").forEach((el) => {
      el.setAttribute("data-download-queued", "1");
      _downloadCheckQueue.push(el);
    });
    pumpDownloadableQueue();
  }

  async function pumpDownloadableQueue() {
    if (_downloadCheckBusy) return;
    _downloadCheckBusy = true;
    while (_downloadCheckQueue.length) {
      const block = _downloadCheckQueue.shift();
      const hash = block.getAttribute("data-download-check");
      if (!hash) continue;
      try {
        const resp = await fetch(`/api/torrents/${encodeURIComponent(hash)}/downloadable-files`);
        if (!resp.ok) continue;
        const data = await resp.json();
        const ids = new Set((data.file_ids || []).map(String));
        const checking = new Set((data.checking_ids || []).map(String));
        block.querySelectorAll("li[data-file-id]").forEach((li) => {
          const id = li.getAttribute("data-file-id");
          if (!id || !checking.has(id)) return;
          const badge = li.querySelector(".file-ui-badge");
          if (!badge) return;
          badge.className = "badge badge-warn file-ui-badge";
          badge.title = "Файл снова качается (.!qB) — после complete будет проверка хеша";
          badge.textContent = "проверка";
        });
        block.querySelectorAll(".file-download-slot[data-file-id]").forEach((slot) => {
          const id = slot.getAttribute("data-file-id");
          if (!id || !ids.has(id) || slot.querySelector("a")) return;
          const link = document.createElement("a");
          link.className = "btn-icon file-download";
          link.href = `/api/torrent-files/${id}/download`;
          link.title = "Скачать файл";
          link.setAttribute("download", "");
          link.innerHTML = _DOWNLOAD_ICON;
          slot.appendChild(link);
        });
      } catch (_) {
        /* сеть/сервер — слот остаётся пустым */
      }
    }
    _downloadCheckBusy = false;
  }

  document.addEventListener("DOMContentLoaded", () => {
    formatLocalTimes();
    enqueueDownloadableChecks();
    initUiSse();
  });
  document.body.addEventListener("htmx:afterSwap", (event) => {
    formatLocalTimes(event.detail.target);
    enqueueDownloadableChecks(event.detail.target);
    const target = event.detail.target;
    if (target && target.id === "job-detail-live") {
      const marker = target.querySelector("[data-selected-job-status]");
      if (marker) {
        target.setAttribute(
          "data-job-status",
          marker.getAttribute("data-selected-job-status") || ""
        );
      }
    }
    const sel = target && target.id ? `#${target.id}` : null;
    if (sel && _uiSsePreserveByTarget.has(sel)) {
      restoreUiSsePreserve(target, _uiSsePreserveByTarget.get(sel));
      _uiSsePreserveByTarget.delete(sel);
    }
  });

  let _uiSseSource = null;
  let _uiSseChannels = [];
  let _uiSseRefreshing = new Set();
  const _uiSsePreserveByTarget = new Map();

  function captureUiSsePreserve(root) {
    const scope = root || document;
    const openKeys = [...scope.querySelectorAll("details[open][data-sse-key]")].map(
      (el) => el.getAttribute("data-sse-key")
    );
    return {
      scrollY: window.scrollY,
      openKeys,
    };
  }

  function restoreUiSsePreserve(root, state) {
    if (!state) return;
    const scope = root || document;
    (state.openKeys || []).forEach((key) => {
      const el = scope.querySelector(`details[data-sse-key="${cssAttrQuote(key)}"]`);
      if (el) el.open = true;
    });
    window.scrollTo(0, state.scrollY || 0);
  }

  function cssAttrQuote(value) {
    return String(value).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
  }

  function refreshUiSseTargets(channel) {
    if (document.visibilityState !== "visible") return;
    const scrollY = window.scrollY;
    const activeJobStatuses = new Set(["pending", "running", "stopping"]);
    document.querySelectorAll(`[data-ui-sse-channel="${cssAttrQuote(channel)}"]`).forEach((el) => {
      if (el.getAttribute("data-ui-sse-active-only") === "1") {
        const jobStatus = (el.getAttribute("data-job-status") || "").toLowerCase();
        // Финальный джоб: не тянем логи/детали на каждый jobs-event.
        if (!activeJobStatuses.has(jobStatus)) return;
      }
      const url = el.getAttribute("data-ui-sse-url");
      const targetSel = el.getAttribute("data-ui-sse-target") || (el.id ? `#${el.id}` : null);
      if (!url || !targetSel) return;
      const key = `${channel}|${targetSel}|${url}`;
      if (_uiSseRefreshing.has(key)) return;
      _uiSseRefreshing.add(key);
      const preserved = captureUiSsePreserve(el);
      preserved.scrollY = scrollY;
      _uiSsePreserveByTarget.set(targetSel, preserved);
      htmx.ajax("GET", url, {
        target: targetSel,
        swap: "innerHTML settle:0 show:none",
      });
      // htmx 1.9 ajax не возвращает Promise
      setTimeout(() => _uiSseRefreshing.delete(key), 1500);
    });
  }

  function initUiSse() {
    const nodes = [...document.querySelectorAll("[data-ui-sse-channel]")];
    if (!nodes.length || typeof EventSource === "undefined") return;
    const channels = [...new Set(nodes.map((n) => n.getAttribute("data-ui-sse-channel")).filter(Boolean))];
    if (!channels.length) return;
    _uiSseChannels = channels;
    const url = `/ui/events?channels=${encodeURIComponent(channels.join(","))}`;
    if (_uiSseSource) {
      _uiSseSource.close();
      _uiSseSource = null;
    }
    const es = new EventSource(url);
    _uiSseSource = es;
    channels.forEach((ch) => {
      es.addEventListener(ch, () => refreshUiSseTargets(ch));
    });
    es.onerror = () => {
      /* браузер сам переподключится */
    };
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !_uiSseChannels.length) return;
    // Пока вкладка была скрыта, события могли пройти мимо — один refresh при возврате.
    _uiSseChannels.forEach((ch) => refreshUiSseTargets(ch));
  });
  </script>
</body>
</html>
