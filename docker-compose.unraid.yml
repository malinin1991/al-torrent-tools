services:
  postgres:
    image: postgres:16
    container_name: altt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: altt
      POSTGRES_USER: altt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-altt}
    volumes:
      # Bind в appdata — не внутри docker.img.
      - /mnt/user/appdata/al-torrent-tools/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altt -d altt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: registry.mageek.su/al-torrent-tools:latest
    # Всегда тянуть latest при up — иначе легко остаться на старом digest.
    pull_policy: always
    container_name: altt_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TORRENT_STORAGE_DIR: /app/data/torrents
      ANILIBRIA_MEDIA_ROOT: /anilibria
      APP_ENV: prod
    volumes:
      - /mnt/user/appdata/al-torrent-tools/torrents:/app/data/torrents
      # rw обязателен: dashboard/API запускает orphan_cleanup apply в процессе api
      - /mnt/user/anilibria:/anilibria:rw
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command:
      [
        "sh",
        "/app/scripts/entrypoint.sh",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker:
    image: registry.mageek.su/al-torrent-tools:latest
    pull_policy: always
    container_name: altt_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TORRENT_STORAGE_DIR: /app/data/torrents
      ANILIBRIA_MEDIA_ROOT: /anilibria
      APP_ENV: prod
    volumes:
      - /mnt/user/appdata/al-torrent-tools/torrents:/app/data/torrents
      # rw обязателен: orphan_cleanup apply удаляет файлы с диска
      - /mnt/user/anilibria:/anilibria:rw
    depends_on:
      postgres:
        condition: service_healthy
    command:
      ["sh", "/app/scripts/entrypoint.sh", "python", "worker.py"]
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck_worker.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  telegram-bot:
    image: registry.mageek.su/al-torrent-tools:latest
    pull_policy: always
    container_name: altt_telegram
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: prod
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    command:
      ["sh", "/app/scripts/entrypoint.sh", "python", "-m", "app.telegram_bot"]
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck_telegram.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  telegram-hevc-bot:
    image: registry.mageek.su/al-torrent-tools:latest
    pull_policy: always
    container_name: altt_telegram_hevc
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: prod
      ALTT_TELEGRAM_PROFILE: hevc
      ALTT_TELEGRAM_HEALTH_FILE: /tmp/altt_telegram_hevc_healthy
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    command:
      ["sh", "/app/scripts/entrypoint.sh", "python", "-m", "app.telegram_bot", "--profile", "hevc"]
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck_telegram.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
