services:
  postgres:
    image: postgres:16
    container_name: altt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: altt
      POSTGRES_USER: altt
      POSTGRES_PASSWORD: altt
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altt -d altt"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: altt_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TORRENT_STORAGE_DIR: /app/data/torrents
      ANILIBRIA_MEDIA_ROOT: /anilibria
    volumes:
      - ./backend:/app
      - ./data/torrents:/app/data/torrents
      - ./data/anilibria:/anilibria:rw
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["sh", "/app/scripts/entrypoint.sh", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: altt_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TORRENT_STORAGE_DIR: /app/data/torrents
      ANILIBRIA_MEDIA_ROOT: /anilibria
    volumes:
      - ./backend:/app
      - ./data/torrents:/app/data/torrents
      - ./data/anilibria:/anilibria:rw
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/app/scripts/entrypoint.sh", "python", "worker.py"]
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck_worker.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  telegram-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: altt_telegram
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["sh", "/app/scripts/entrypoint.sh", "python", "-m", "app.telegram_bot"]
    healthcheck:
      test: ["CMD", "python", "/app/scripts/healthcheck_telegram.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pg_data:
