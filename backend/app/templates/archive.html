{% extends "base.html" %}
{% block content %}
<h1>Архив торрентов</h1>
<div class="card" style="margin-bottom:12px;">
  <form method="get" action="/archive" class="row">
    <input class="input" style="max-width:320px;" name="search" placeholder="Поиск по названию" value="{{ search }}" />
    <button class="btn" type="submit">Найти</button>
  </form>
</div>
<div class="card">
  <div
    id="archive-live"
    data-ui-sse-channel="archive"
    data-ui-sse-url="/archive/live?search={{ search|urlencode }}&page={{ page }}"
    data-ui-sse-target="#archive-live"
    data-encoder-enabled="{% if video_kensetsu_ok %}1{% else %}0{% endif %}"
  >
    {% include "partials/archive_live.html" %}
  </div>
</div>
{% endblock %}
