<table>
  <thead>
    <tr><th>ID</th><th>Тип</th><th>Статус</th><th>Ошибка</th></tr>
  </thead>
  <tbody>
    {% for job in jobs %}
    <tr>
      <td><a href="/jobs?job_id={{ job.id }}">{{ job.id }}</a></td>
      <td>{{ job.type }}</td>
      <td><span class="job-status job-status-{{ job.status }}">{{ job.status }}</span></td>
      <td>{{ job.error or "-" }}</td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="muted">Джобов пока нет</td></tr>
    {% endfor %}
  </tbody>
</table>
