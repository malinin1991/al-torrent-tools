{% extends "base.html" %}
{% block content %}
<p class="muted" style="margin-bottom:8px;"><a href="/pipeline">← Пайплайн</a></p>
<h1>Пайплайн #{{ pipeline.id }} <span class="muted" style="font-weight:normal;font-size:0.85rem;">live · SSE</span></h1>

<div
  id="pipeline-detail-live"
  data-ui-sse-channel="pipeline_detail:{{ pipeline.id }}"
  data-ui-sse-url="/pipeline/{{ pipeline.id }}/live"
  data-ui-sse-target="#pipeline-detail-live"
>
  {% include "partials/pipeline_detail_live.html" %}
</div>
<script>
function copyPipelineLifePath() {
  const pre = document.getElementById("pipeline-life-path-text");
  const status = document.getElementById("copy-pipeline-path-status");
  if (!pre) return;
  const text = pre.textContent || "";
  const onSuccess = () => {
    if (status) {
      status.hidden = false;
      setTimeout(() => { status.hidden = true; }, 2000);
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(onSuccess).catch(() => fallbackCopyPipelinePath(text, onSuccess));
  } else {
    fallbackCopyPipelinePath(text, onSuccess);
  }
}
function fallbackCopyPipelinePath(text, onSuccess) {
  const area = document.createElement("textarea");
  area.value = text;
  area.style.position = "fixed";
  area.style.left = "-9999px";
  document.body.appendChild(area);
  area.select();
  try {
    document.execCommand("copy");
    onSuccess();
  } finally {
    document.body.removeChild(area);
  }
}
</script>
{% endblock %}
