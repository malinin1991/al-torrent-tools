<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AL Torrent Tools</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #121212; color: #eee; }
    header { padding: 12px 20px; background: #1f1f1f; }
    nav a { color: #9ad1ff; margin-right: 16px; text-decoration: none; }
    main { padding: 20px; }

      display: grid;
      grid-template-columns: 1fr 3fr;
      gap: 12px;
    }
    .jobs-live-grid > .card { min-width: 0; overflow: hidden; }
    @media (max-width: 900px) {
      .jobs-live-grid { grid-template-columns: 1fr; }
    }
    .jobs-catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }
    .job-catalog-card h3 { color: #9ad1ff; font-size: 1.05rem; }
    .job-card-meta { margin: 0 0 8px; font-size: 0.9rem; }
    .job-meta-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0;
      min-width: 0;
    }
    .job-meta-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      color: #9b9b9b;
    }
    .job-meta-icon svg { width: 16px; height: 16px; fill: currentColor; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn { background: #2c4f76; color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      line-height: 0;
    }
    .btn-icon svg { width: 18px; height: 18px; fill: currentColor; }
    .col-download { width: 48px; text-align: center; }
    .btn-secondary { background: #3a3a3a; }
    .btn-danger { background: #823b3b; }
    .input, select, textarea { width: 100%; background: #101010; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border-bottom: 1px solid #343434; padding: 8px; text-align: left; vertical-align: top; overflow-wrap: anywhere; word-break: break-word; }
    .log-toolbar { justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; }
    .log-toolbar h3 { margin: 0; }

      overflow-x: hidden;
      overflow-y: auto;
      background: #101010;
      border: 1px solid #333;
      border-radius: 6px;

      font-size: 0.85rem;
      line-height: 1.45;
    }
    .log-line {
      display: flex;
      gap: 8px;
      padding: 2px 0;
      border-bottom: 1px solid #1f1f1f;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }
    .log-line:last-child { border-bottom: 0; }
    .log-ts { color: #8a8a8a; flex: 0 0 auto; white-space: nowrap; }
    .log-level { flex: 0 0 56px; text-transform: lowercase; color: #9ad1ff; }
    .log-msg {
      flex: 1 1 0;
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .log-level-error { color: #ff8a80; }
    .log-level-warning { color: #ffcc80; }
    .log-level-debug { color: #6a6a6a; }
    .copy-status { font-size: 0.85rem; color: #8dffb0; }
    .muted { color: #9b9b9b; }
    .row { display: flex; gap: 8px; align-items: center; }
    .settings-group h2 { margin: 0 0 12px; font-size: 1.1rem; color: #9ad1ff; }
    .settings-group .grid { margin-top: 8px; }
    .settings-hint { display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; width: fit-content; }
    .badge-ok { background: #1f3d2a; color: #8dffb0; }
    .badge-warn { background: #3d2f1f; color: #ffcc80; }
    .badge-danger { background: #3d1f1f; color: #ff8a80; }
    .badge-muted { background: #2a2a2a; color: #9b9b9b; }
    .job-status-running, .job-status-discovered, .job-status-waiting_master, .job-status-waiting_slave, .job-status-master_added, .job-status-master_complete, .job-status-slave_added { color: #ffcc80; }
    .job-status-stopping { color: #ffcc80; opacity: 0.85; }
    .job-status-success, .job-status-done { color: #8dffb0; }
    .job-status-failed, .job-status-error { color: #ff8a80; }
    .job-status-cancelled, .job-status-pending { color: #9b9b9b; }
    .tg-status-skipped { color: #9b9b9b; }
    .tg-status-pending, .tg-status-queued { color: #ffcc80; }
    .tg-status-sent { color: #8dffb0; }
    .master-state-downloading { color: #9ad1ff; }
    .master-state-seeding { color: #8dffb0; }
    .master-state-stopped { color: #ffcc80; }
    .master-state-error { color: #ff8a80; }
    .master-state-missing, .master-state-unavailable { color: #9b9b9b; }
    .gl-pipeline-board {
      display: flex;
      flex-direction: column;
      gap: 0;
      min-width: 0;
    }
    .gl-pipeline-main-row {
      display: flex;
      align-items: flex-start;
      list-style: none;
      margin: 0;
      padding: 0;
      flex-wrap: nowrap;
    }
    .gl-pipeline-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 0 0 auto;
    }
    .gl-pipeline-col-master { align-items: center; }
    .gl-pipeline-sm .gl-pipeline-col { min-width: 40px; }
    .gl-pipeline-lg .gl-pipeline-col { min-width: 72px; }
    .gl-pipeline-sm .gl-stage-label { font-size: 0.65rem; }
    .gl-pipeline-lg .gl-stage-label { font-size: 0.85rem; }
    .gl-pipeline-lg { margin-bottom: 4px; }
    .gl-pipeline-detail-head {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .gl-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .gl-stage-side { opacity: 0.95; }
    .gl-pipeline-fork {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 0;
    }
    .gl-v-connector {
      width: 2px;
      height: 10px;
      background: #444;
      flex: 0 0 auto;
    }
    .gl-pipeline-lg .gl-v-connector { height: 14px; }
    .gl-pipeline-fork-done {
      align-items: flex-start;
    }
    .gl-diag-connector {
      width: 12px;
      height: 12px;
      border-left: 2px solid #444;
      border-bottom: 2px solid #444;
      margin: 0 0 2px 5px;
      flex: 0 0 auto;
      box-sizing: border-box;
    }
    .gl-pipeline-lg .gl-diag-connector {
      width: 16px;
      height: 16px;
      margin-left: 7px;
    }
    .gl-pipeline-fork-slave {
      align-items: flex-start;
    }
    .gl-pipeline-fork-check {
      display: flex;
      align-items: flex-start;
      flex-wrap: nowrap;
    }
    .gl-fork-h-connector {
      flex: 0 0 14px;
      height: 2px;
      background: #444;
      margin: 6px 2px 0;
      align-self: flex-start;
    }
    .gl-pipeline-lg .gl-fork-h-connector {
      flex-basis: 22px;
      margin-top: 8px;
    }
    .gl-stage-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #666;
      background: #1b1b1b;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      color: transparent;
    }
    .gl-pipeline-lg .gl-stage-dot { width: 18px; height: 18px; font-size: 13px; }
    .gl-stage-label { color: #9b9b9b; line-height: 1.1; white-space: nowrap; }
    .gl-stage-connector {
      flex: 0 0 18px;
      height: 2px;
      background: #444;
      margin: 6px 2px 0;
      align-self: flex-start;
    }
    .gl-pipeline-sm .gl-stage-connector { flex-basis: 10px; }
    .gl-pipeline-lg .gl-stage-connector { flex-basis: 28px; margin-top: 8px; }
    .gl-stage-pending .gl-stage-dot { border-color: #555; background: #222; }
    .gl-stage-pending .gl-stage-label { color: #666; }
    .gl-stage-skipped .gl-stage-dot {
      border-color: #444;
      background: #1a1a1a;
      color: #666;
    }
    .gl-stage-skipped .gl-stage-label { color: #555; }
    .gl-stage-running .gl-stage-dot {
      border-color: #1f75cb;
      background: #1f75cb;
      animation: gl-stage-pulse 1.2s ease-in-out infinite;
    }
    .gl-stage-running .gl-stage-label { color: #9ad1ff; }
    .gl-stage-success .gl-stage-dot { border-color: #2da160; background: #2da160; }
    .gl-stage-success .gl-stage-label { color: #8dffb0; }
    .gl-stage-failed .gl-stage-dot {
      border-color: #ec5941;
      background: #ec5941;
      color: #fff;
    }
    .gl-stage-failed .gl-stage-label { color: #ff8a80; }
    .gl-stage-cancelled .gl-stage-dot {
      border-color: #888;
      background: #555;
      color: #ddd;
    }
    .gl-stage-cancelled .gl-stage-label { color: #9b9b9b; }
    .gl-pipeline-status-text { display: block; font-size: 0.75rem; margin-top: 4px; }
    .pipeline-list-table { width: 100%; table-layout: fixed; }
    .pipeline-list-table col.pipeline-col-id { width: 20rem; }
    .pipeline-list-table col.pipeline-col-release { width: auto; }
    .pipeline-list-table col.pipeline-col-torrent { width: 18rem; }
    .pipeline-list-table col.pipeline-col-graph { width: 20rem; }
    .pipeline-list-table th, .pipeline-list-table td {
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pipeline-list-id {
      white-space: nowrap;
      overflow-wrap: normal;
      word-break: normal;
    }
    .pipeline-list-hash {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      white-space: nowrap;
      word-break: normal;
      overflow-wrap: normal;
      line-height: 1.25;
      margin-top: 2px;
    }
    .pipeline-list-release,
    .pipeline-list-torrent {
      white-space: nowrap;
      overflow-wrap: normal;
      word-break: normal;
    }
    .pipeline-list-graph {
      overflow: visible;
      overflow-wrap: normal;
      word-break: normal;
      white-space: normal;
    }
    .pipeline-list-graph .gl-pipeline-board {
      width: max-content;
    }
    @keyframes gl-stage-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(31, 117, 203, 0.55); }
      50% { box-shadow: 0 0 0 5px rgba(31, 117, 203, 0); }
    }
    tr.row-selected td { background: #243044; }
    a { color: #9ad1ff; }
    code { background: #101010; padding: 2px 6px; border-radius: 4px; }
    .release-block {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .release-summary {
      list-style: none;

      gap: 8px 16px;

      justify-content: space-between;
      padding: 14px 16px;

    }

    details[open] > .release-summary::before { content: "▾"; }
    .release-title {
      display: flex;

      user-select: text;

    }
    .release-name-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .release-meta { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 0.9rem; }
    .release-body { padding: 0 16px 16px; border-top: 1px solid #2a2a2a; }
    .genre-tags {
      display: flex;

      gap: 6px;

    }
    .genre-tag {

    }
    .member-tags {
      display: flex;

      gap: 6px;
      margin-top: 6px;
    }
    .member-tag {

      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      line-height: 1.4;

    .member-tag--voicing { background: #1a3d3a; color: #7fd4c8; border-color: #2a5c56; }
    .member-tag--editing { background: #3d321a; color: #e8c07a; border-color: #5c4a2a; }
    .member-tag--timing { background: #1f3d2a; color: #8dffb0; border-color: #2f5c3d; }
    .member-tag--translating { background: #1a2e4a; color: #8bb8f0; border-color: #2a4a6e; }
    .member-tag--decorating { background: #3d2420; color: #f0a090; border-color: #5c3830; }
    .member-tag--poster { background: #2a2e36; color: #c0c8d4; border-color: #3d4450; }
    .member-tag--unknown { background: #2a2a2a; color: #9b9b9b; border-color: #3a3a3a; }
    .info-table { width: 100%; table-layout: auto; }
    .info-table th {
      width: 140px;
      color: #9b9b9b;
      font-weight: normal;
      border-bottom: 1px solid #2a2a2a;
      white-space: nowrap;
    }
    .info-table td { border-bottom: 1px solid #2a2a2a; }
    .info-table tr:last-child th,
    .info-table tr:last-child td { border-bottom: 0; }
    .pipeline-timeline {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pipeline-timeline-item {
      border-left: 2px solid #354a66;
      padding: 0 0 2px 12px;
    }
    .pipeline-timeline-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }
    .pipeline-timeline-message { margin-bottom: 4px; }
    .pipeline-timeline-links { font-size: 0.85rem; }
    .pipeline-event-details { margin-top: 4px; }

      border: 1px solid #2a2a2a;
      border-radius: 6px;

      font-size: 0.82rem;

    }
    tr.torrent-files-row td {
      padding-top: 0;

    }
    .torrent-files {

    .file-list .file-copy-path,

    .file-list .file-copy-path svg,

    .btn-link {
      background: none;
      border: 0;
      padding: 0;
      color: #9ad1ff;

    }

    #encoder-preset-dialog {
      border: 1px solid #444;
      border-radius: 8px;

      color: #eee;
      padding: 16px;

    #encoder-preset-dialog select.input { min-width: 220px; }

    #mediainfo-dialog {

    #mediainfo-dialog .mi-flag { display: inline-block; font-weight: 700; font-size: 0.9rem; line-height: 1; }

    #mediainfo-dialog details.mi-fonts > summary { cursor: pointer; font-weight: 600; font-size: 0.82rem; color: #7cb8ff; text-transform: uppercase; letter-spacing: 0.5px; list-style: none; }
    #mediainfo-dialog details.mi-fonts > summary::-webkit-details-marker { display: none; }
    #mediainfo-dialog pre.mi-raw { background: #141414; border: 1px solid #333; border-radius: 4px; padding: 10px; font-size: 0.8rem; max-height: 280px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 8px 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    #mediainfo-dialog .mi-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 10px; border-top: 1px solid #333; flex-wrap: wrap; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Главная</a>
      <a href="/info">Информация</a>
      <a href="/settings">Настройки</a>
      <a href="/jobs">Джобы</a>
      <a href="/releases">Релизы</a>
      <a href="/archive">Архив</a>
      <a href="/pipeline">Пайплайн</a>
      <a href="/telegram-access">Доступ Telegram</a>
      {% if video_kensetsu_ok and video_kensetsu_base_url %}
      <a href="{{ video_kensetsu_base_url }}" target="_blank" rel="noopener">Кодировщик</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
  function formatLocalTimes(root) {
    const scope = root || document;
    scope.querySelectorAll("time.local-time[datetime]").forEach((el) => {
      const raw = el.getAttribute("datetime");
      if (!raw) return;
      const date = new Date(raw);
      if (Number.isNaN(date.getTime())) return;
      el.textContent = date.toLocaleString(undefined, {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
      });
      el.title = date.toString();
    });
  }
  const _downloadCheckQueue = [];
  let _downloadCheckBusy = false;
  const _downloadProbeCache = new Map(); // hash → {file_ids, checking_ids, ts}
  const _DOWNLOAD_PROBE_TTL_MS = 60_000;
  const _DOWNLOAD_PROBE_CHUNK = 100;
  const _DOWNLOAD_ICON =
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.2l3.6-3.6L17 11l-5 5-5-5 1.4-1.4L11 13.2V3h1zM5 19h14v2H5v-2z"/></svg>';
  const _COPY_PATH_ICON =
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
  const _ENCODER_ICON =
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4V6zm0 5h10v2H4v-2zm0 5h16v2H4v-2zm14-6.5l4 2.5-4 2.5v-5z"/></svg>';

  function isEncoderUiEnabled() {
    const marked = document.querySelector("[data-encoder-enabled]");
    return marked && marked.getAttribute("data-encoder-enabled") === "1";
  }

  function formatApiErrorDetail(detail) {
    if (detail == null || detail === "") return null;
    if (typeof detail === "string") return detail;
    if (Array.isArray(detail)) {
      return detail
        .map((item) => {
          if (typeof item === "string") return item;
          if (item && typeof item === "object") {
            const loc = Array.isArray(item.loc)
              ? item.loc.filter((part) => part !== "body").join(".")
              : "";
            const msg = item.msg || JSON.stringify(item);
            return loc ? `${loc}: ${msg}` : msg;
          }
          return String(item);
        })
        .join("; ");
    }
    if (typeof detail === "object") {
      const parts = [];
      const main =
        detail.message || detail.msg || detail.error || null;
      if (main) parts.push(String(main));
      if (Array.isArray(detail.local_errors) && detail.local_errors.length) {
        const brief = detail.local_errors
          .slice(0, 3)
          .map((item) => {
            if (!item) return "";
            if (typeof item === "string") return item;
            return item.error ? String(item.error) : "";
          })
          .filter(Boolean)
          .join("; ");
        const extra =
          detail.local_errors.length > 3
            ? ` (+${detail.local_errors.length - 3})`
            : "";
        if (brief) parts.push(brief + extra);
      }
      if (parts.length) return parts.join(" — ");
      return JSON.stringify(detail);
    }
    return String(detail);
  }

  async function copyTextToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }

  function ensureEncoderPresetDialog() {
    let dialog = document.getElementById("encoder-preset-dialog");
    if (dialog) return dialog;
    dialog = document.createElement("dialog");
    dialog.id = "encoder-preset-dialog";
    dialog.innerHTML =
      '<form method="dialog" id="encoder-preset-form">' +
      "<p style=\"margin:0 0 10px;\">Выберите пресет кодирования</p>" +
      '<label class="row" style="margin-bottom:12px;">Пресет' +
      '<select class="input" name="preset_id" id="encoder-preset-select" required></select>' +
      "</label>" +
      '<div class="row" style="justify-content:flex-end;">' +
      '<button class="btn btn-secondary" value="cancel" type="submit" formnovalidate>Отмена</button>' +
      '<button class="btn" value="ok" type="submit">Отправить</button>' +
      "</div></form>";
    document.body.appendChild(dialog);
    return dialog;
  }

  async function pickEncoderPreset() {
    const dialog = ensureEncoderPresetDialog();
    const select = dialog.querySelector("#encoder-preset-select");
    select.innerHTML = "";
    const resp = await fetch("/api/video-kensetsu/presets");
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(formatApiErrorDetail(err.detail) || `HTTP ${resp.status}`);
    }
    const data = await resp.json();
    const presets = data.presets || [];
    if (!presets.length) throw new Error("Пресеты не найдены");

    const groups = new Map();
    const ungrouped = [];
    presets.forEach((p) => {
      const group = (p.group || "").trim();
      if (!group) {
        ungrouped.push(p);
        return;
      }
      if (!groups.has(group)) groups.set(group, []);
      groups.get(group).push(p);
    });

    const groupLabels = { rip: "WEBRip / HDTV / BDRip", remux: "BD / Remux" };
    const appendOption = (parent, p) => {
      const opt = document.createElement("option");
      opt.value = p.id;
      const name = p.name || p.id;
      opt.textContent = p.id && p.id !== name ? `${name} (${p.id})` : name;
      if (p.available === false) {
        opt.disabled = true;
        opt.textContent += " — недоступен";
      }
      parent.appendChild(opt);
    };

    groups.forEach((items, group) => {
      const og = document.createElement("optgroup");
      og.label = groupLabels[group] || group;
      items.forEach((p) => appendOption(og, p));
      select.appendChild(og);
    });
    ungrouped.forEach((p) => appendOption(select, p));

    const firstEnabled = [...select.querySelectorAll("option")].find((o) => !o.disabled);
    if (firstEnabled) select.value = firstEnabled.value;

    dialog.showModal();
    return new Promise((resolve) => {
      const onClose = () => {
        dialog.removeEventListener("close", onClose);
        if (dialog.returnValue === "ok") {
          const selected = select.selectedOptions[0];
          if (!selected || selected.disabled) {
            resolve(null);
            return;
          }
          resolve(select.value || null);
        } else {
          resolve(null);
        }
      };
      dialog.addEventListener("close", onClose);
    });
  }

  function selectedEncodeFileIds(root) {
    const scope = root || document;
    return [...scope.querySelectorAll(".file-encode-check:checked")]
      .map((el) => el.getAttribute("data-file-id"))
      .filter(Boolean)
      .map((id) => Number(id))
      .filter((id) => Number.isFinite(id));
  }

  function ensureEncoderBatchBar() {
    let bar = document.getElementById("encoder-batch-bar");
    if (bar) return bar;
    bar = document.createElement("div");
    bar.id = "encoder-batch-bar";
    bar.innerHTML =
      '<div class="encoder-batch-count">Выбрано: <strong data-encoder-count>0</strong></div>' +
      '<div class="encoder-batch-status" data-encoder-status></div>' +
      '<div class="encoder-batch-actions">' +
      '<button type="button" class="btn btn-secondary" data-encoder-clear>Снять все</button>' +
      '<button type="button" class="btn" data-encoder-send>Отправить в кодировщик</button>' +
      "</div>";
    document.body.appendChild(bar);
    bar.querySelector("[data-encoder-clear]").addEventListener("click", () => {
      document.querySelectorAll(".file-encode-check:checked").forEach((el) => {
        el.checked = false;
      });
      updateEncoderBatchBar();
    });
    bar.querySelector("[data-encoder-send]").addEventListener("click", async () => {
      const ids = selectedEncodeFileIds();
      if (!ids.length) return;
      const sendBtn = bar.querySelector("[data-encoder-send]");
      const statusEl = bar.querySelector("[data-encoder-status]");
      try {
        sendBtn.disabled = true;
        statusEl.textContent = "Выбор пресета…";
        const presetId = await pickEncoderPreset();
        if (!presetId) {
          statusEl.textContent = "";
          return;
        }
        statusEl.textContent = "Отправка…";
        const resp = await fetch("/api/torrent-files/send-to-encoder", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ file_ids: ids, preset_id: presetId }),
        });
        const payload = await resp.json().catch(() => ({}));
        if (!resp.ok && resp.status !== 207) {
          throw new Error(formatApiErrorDetail(payload.detail) || `HTTP ${resp.status}`);
        }
        const created = payload.created;
        const encErrors = Array.isArray(payload.errors) ? payload.errors.length : 0;
        const localErrors = Array.isArray(payload.local_errors) ? payload.local_errors.length : 0;
        const parts = [];
        if (created != null) parts.push(`отправлено: ${created}`);
        if (encErrors) parts.push(`ошибок энкодера: ${encErrors}`);
        if (localErrors) parts.push(`локальных: ${localErrors}`);
        statusEl.textContent = parts.join("; ") || "Готово";
        // Снимаем только успешно принятые file_ids — local/encoder errors остаются выбранными.
        const accepted = new Set(
          (Array.isArray(payload.file_ids) ? payload.file_ids : []).map(String)
        );
        if (accepted.size) {
          document.querySelectorAll(".file-encode-check:checked").forEach((el) => {
            const id = el.getAttribute("data-file-id");
            if (id && accepted.has(String(id))) el.checked = false;
          });
          updateEncoderBatchBar();
        }
      } catch (err) {
        statusEl.textContent = err && err.message ? err.message : "Ошибка отправки";
      } finally {
        sendBtn.disabled = false;
      }
    });
    return bar;
  }

  function updateEncoderBatchBar() {
    if (!isEncoderUiEnabled()) {
      const existing = document.getElementById("encoder-batch-bar");
      if (existing) existing.classList.remove("is-visible");
      document.body.classList.remove("has-encoder-batch-bar");
      return;
    }
    const bar = ensureEncoderBatchBar();
    const count = selectedEncodeFileIds().length;
    const countEl = bar.querySelector("[data-encoder-count]");
    if (countEl) countEl.textContent = String(count);
    if (count > 0) {
      bar.classList.add("is-visible");
      document.body.classList.add("has-encoder-batch-bar");
    } else {
      bar.classList.remove("is-visible");
      document.body.classList.remove("has-encoder-batch-bar");
      const statusEl = bar.querySelector("[data-encoder-status]");
      if (statusEl && !statusEl.textContent.includes("отправлено") && !statusEl.textContent.includes("ошиб")) {
        statusEl.textContent = "";
      }
    }
  }

  function ensureFileEncodeCheckbox(li, fileId) {
    if (!isEncoderUiEnabled() || !li || !fileId) return;
    let check = li.querySelector(":scope > .file-encode-check");
    if (check) {
      check.setAttribute("data-file-id", String(fileId));
      return;
    }
    check = document.createElement("input");
    check.type = "checkbox";
    check.className = "file-encode-check";
    check.setAttribute("data-file-id", String(fileId));
    check.title = "Выбрать для кодировщика";
    check.addEventListener("change", updateEncoderBatchBar);
    check.addEventListener("click", (event) => event.stopPropagation());
    li.insertBefore(check, li.firstChild);
  }

  function removeFileEncodeCheckbox(li) {
    if (!li) return;
    const check = li.querySelector(":scope > .file-encode-check");
    if (check) {
      check.remove();
      updateEncoderBatchBar();
    }
  }

  function syncTorrentEncodeSelectActions(block) {
    if (!block) return;
    const actions = block.querySelector(".torrent-encode-select-actions");
    if (!actions) return;
    if (!isEncoderUiEnabled()) {
      actions.hidden = true;
      return;
    }
    const hasChecks = !!block.querySelector(".file-encode-check");
    actions.hidden = !hasChecks;
    if (actions.dataset.bound === "1") return;
    actions.dataset.bound = "1";
    const selectAll = actions.querySelector(".torrent-encode-select-all");
    const clearBtn = actions.querySelector(".torrent-encode-clear");
    if (selectAll) {
      selectAll.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        block.querySelectorAll(".file-encode-check").forEach((el) => {
          el.checked = true;
        });
        updateEncoderBatchBar();
      });
    }
    if (clearBtn) {
      clearBtn.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        block.querySelectorAll(".file-encode-check").forEach((el) => {
          el.checked = false;
        });
        updateEncoderBatchBar();
      });
    }
  }

  function ensureCopyPathButton(slot) {
    const fullPath = slot.getAttribute("data-full-path");
    if (!fullPath || slot.querySelector(".file-copy-path")) return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn-icon file-copy-path";
    btn.title = "Копировать путь";
    btn.setAttribute("aria-label", "Копировать путь");
    btn.innerHTML = _COPY_PATH_ICON;
    btn.addEventListener("click", async (event) => {
      event.preventDefault();
      event.stopPropagation();
      try {
        await copyTextToClipboard(fullPath);
        btn.title = "Скопировано";
        setTimeout(() => {
          btn.title = "Копировать путь";
        }, 1500);
      } catch (_) {
        btn.title = "Не удалось скопировать";
      }
    });
    const download = slot.querySelector("a.file-download");
    if (download) {
      download.after(btn);
    } else {
      slot.appendChild(btn);
    }
  }

  function ensureEncoderButton(slot) {
    if (!isEncoderUiEnabled()) return;
    const id = slot.getAttribute("data-file-id");
    if (!id || slot.querySelector(".file-send-encoder")) return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn-icon file-send-encoder";
    btn.title = "Отправить в кодировщик";
    btn.setAttribute("aria-label", "Отправить в кодировщик");
    btn.innerHTML = _ENCODER_ICON;
    btn.addEventListener("click", async (event) => {
      event.preventDefault();
      event.stopPropagation();
      const prevTitle = btn.title;
      try {
        btn.disabled = true;
        btn.title = "Загрузка пресетов…";
        const presetId = await pickEncoderPreset();
        if (!presetId) {
          btn.title = prevTitle;
          return;
        }
        btn.title = "Отправка…";
        const resp = await fetch(`/api/torrent-files/${encodeURIComponent(id)}/send-to-encoder`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ preset_id: presetId }),
        });
        const payload = await resp.json().catch(() => ({}));
        if (!resp.ok && resp.status !== 207) {
          throw new Error(formatApiErrorDetail(payload.detail) || `HTTP ${resp.status}`);
        }
        const encErrors = Array.isArray(payload.errors) ? payload.errors.length : 0;
        const isPartial =
          resp.status === 207 || payload.partial === true || encErrors > 0 || payload.ok === false;
        if (isPartial) {
          const errHint =
            encErrors > 0
              ? (payload.errors[0] && (payload.errors[0].error || payload.errors[0].message)) ||
                "частичный ответ"
              : "частичный ответ";
          btn.title = `Ошибка / частично: ${errHint}`;
          setTimeout(() => {
            btn.title = prevTitle;
          }, 3500);
        } else {
          btn.title = "Отправлено";
          setTimeout(() => {
            btn.title = prevTitle;
          }, 2000);
        }
      } catch (err) {
        btn.title = err && err.message ? err.message : "Ошибка отправки";
        setTimeout(() => {
          btn.title = prevTitle;
        }, 3500);
      } finally {
        btn.disabled = false;
      }
    });
    slot.appendChild(btn);
  }

  const _MEDIAINFO_ICON =
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>';

  function ensureMediaInfoDialog() {
    let dialog = document.getElementById("mediainfo-dialog");
    if (dialog) return dialog;
    dialog = document.createElement("dialog");
    dialog.id = "mediainfo-dialog";
    dialog.innerHTML =
      '<div class="mi-header">' +
        '<div>' +
          '<h3 class="mi-title" id="mi-modal-title">MediaInfo</h3>' +
          '<div id="mi-modal-subtitle" style="font-size:0.8rem;color:#888;margin-top:2px;"></div>' +
        '</div>' +
        '<button class="btn btn-secondary btn-icon" id="mi-modal-close" title="Закрыть" aria-label="Закрыть" style="margin-top:-4px;line-height:1;font-size:1.1rem;padding:2px 8px;">✕</button>' +
      '</div>' +
      '<div id="mi-modal-body"></div>';
    document.body.appendChild(dialog);
    dialog.querySelector("#mi-modal-close").addEventListener("click", () => dialog.close());
    let backdropMouseDown = false;
    function isBackdropClick(e) {
      if (e.target !== dialog) return false;
      const r = dialog.getBoundingClientRect();
      return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
    }
    dialog.addEventListener("mousedown", (e) => {
      backdropMouseDown = isBackdropClick(e);
    });
    dialog.addEventListener("mouseup", (e) => {
      if (backdropMouseDown && isBackdropClick(e)) dialog.close();
      backdropMouseDown = false;
    });
    return dialog;
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatMediaInfoFileSize(val) {
    if (val == null || val === "") return "";
    if (typeof val === "string" && !/^\d+(\.\d+)?$/.test(val.trim())) return val;
    const num = Number(val);
    if (!Number.isFinite(num) || num <= 0) return "";
    if (num >= 1073741824) return `${(num / 1073741824).toFixed(2)} ГиБ`;
    if (num >= 1048576) return `${(num / 1048576).toFixed(1)} МиБ`;
    if (num >= 1024) return `${Math.round(num / 1024)} КиБ`;
    return `${Math.round(num)} Б`;
  }

  async function showMediaInfoModal(fileId, relativePath, initialFullPath) {
    const dialog = ensureMediaInfoDialog();
    const titleEl = dialog.querySelector("#mi-modal-title");
    const subTitleEl = dialog.querySelector("#mi-modal-subtitle");
    const bodyEl = dialog.querySelector("#mi-modal-body");

    titleEl.textContent = relativePath ? relativePath.split("/").pop() : `Файл #${fileId}`;
    subTitleEl.textContent = relativePath || (initialFullPath ? initialFullPath : "");
    bodyEl.innerHTML = '<div style="padding:24px 0;text-align:center;color:#888;">Загрузка MediaInfo…</div>';

    dialog.showModal();

    await loadMediaInfoData(fileId, bodyEl, false);
  }

  async function loadMediaInfoData(fileId, container, force) {
    try {
      const url = force
        ? `/api/torrent-files/${encodeURIComponent(fileId)}/mediainfo/refresh`
        : `/api/torrent-files/${encodeURIComponent(fileId)}/mediainfo`;
      const method = force ? "POST" : "GET";
      const resp = await fetch(url, { method });
      const data = await resp.json().catch(() => ({}));

      if (!resp.ok) {
        container.innerHTML = `<div class="badge badge-danger" style="padding:10px;display:block;margin:10px 0;">Ошибка: ${escapeHtml(data.detail || `HTTP ${resp.status}`)}</div>`;
        return;
      }

      if (data.status !== "ready") {
        let warnText = data.error || "Информация о файле пока недоступна.";
        if (data.status === "in_progress") {
          warnText = "Файл проверяется или ещё загружается на master.";
        } else if (data.status === "file_missing") {
          warnText = "Файл ещё не скачан или отсутствует на диске.";
        }
        container.innerHTML = `
          <div style="padding:18px;text-align:center;">
            <p class="muted" style="margin-bottom:12px;">${escapeHtml(warnText)}</p>
            <button class="btn btn-secondary" id="mi-retry-btn" type="button">Попробовать снова</button>
          </div>
        `;
        container.querySelector("#mi-retry-btn")?.addEventListener("click", () => {
          container.innerHTML = '<div style="padding:24px 0;text-align:center;color:#888;">Повторная попытка…</div>';
          loadMediaInfoData(fileId, container, true);
        });
        return;
      }

      renderMediaInfoContent(container, data, fileId);
    } catch (err) {
      container.innerHTML = `<div class="badge badge-danger" style="padding:10px;display:block;margin:10px 0;">Ошибка сети: ${escapeHtml(err.message)}</div>`;
    }
  }

  function miFlagIcon(value, label) {
    const title = escapeHtml(label || "");
    if (value === true) {
      return `<span class="mi-flag mi-flag-yes" title="${title}: да">✓</span>`;
    }
    if (value === false) {
      return `<span class="mi-flag mi-flag-no" title="${title}: нет">✕</span>`;
    }
    return `<span class="mi-flag mi-flag-unk" title="${title}: неизвестно">—</span>`;
  }

  function renderMediaInfoContent(container, data, fileId) {
    const summary = data.summary || {};
    const videos = summary.videos || [];
    const audios = summary.audios || [];
    const subs = summary.subtitles || [];
    const fonts = Array.isArray(summary.fonts) ? summary.fonts : [];
    const rawText = data.raw_text || "";

    let html = "";

    if (data.cached_only) {

  function ensureMediaInfoButton(slot) {
    const id = slot.getAttribute("data-file-id");
    if (!id || slot.querySelector(".file-mediainfo")) return;
    const fullPath = slot.getAttribute("data-full-path") || "";
    const li = slot.closest("li");
    const codeEl = li ? li.querySelector("code") : null;
    const relPath = codeEl ? codeEl.textContent.trim() : "";

    const name = relPath || fullPath || "";
    const extMatch = name.match(/\.([a-z0-9]+)$/i);
    const ext = extMatch ? extMatch[1].toLowerCase() : "";
    const mediaExts = new Set(["mkv", "mp4", "avi", "m4v", "mov", "flv", "wmv", "webm", "ts", "m2ts", "flac", "mp3", "aac", "ac3", "mka"]);
    if (ext && !mediaExts.has(ext)) return;

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn-icon file-mediainfo";
    btn.title = "MediaInfo";
    btn.setAttribute("aria-label", "MediaInfo");
    btn.innerHTML = _MEDIAINFO_ICON;
    btn.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      showMediaInfoModal(id, relPath, fullPath);
    });
    slot.appendChild(btn);
  }

  function clearDownloadableSlotButtons(slot) {
    if (!slot) return;
    slot.querySelectorAll("a.file-download, .file-copy-path, .file-send-encoder, .file-mediainfo").forEach((el) => el.remove());
    const li = slot.closest("li[data-file-id]");
    removeFileEncodeCheckbox(li);
  }

  function applyDownloadableProbe(block, data) {
    if (!block || !data) return;
    const ids = new Set((data.file_ids || []).map(String));
    const checking = new Set((data.checking_ids || []).map(String));
    block.querySelectorAll("li[data-file-id]").forEach((li) => {
      const id = li.getAttribute("data-file-id");
      if (!id || !checking.has(id)) return;
      const badge = li.querySelector(".file-ui-badge");
      if (!badge) return;
      badge.className = "badge badge-warn file-ui-badge";
      badge.title = "Качается или проверяется на master";
      badge.textContent = "проверка";
    });
    block.querySelectorAll(".file-download-slot[data-file-id]").forEach((slot) => {
      const id = slot.getAttribute("data-file-id");
      if (!id) return;
      const li = slot.closest("li[data-file-id]");
      // checking и не-downloadable — убрать кнопки (в т.ч. stale media_present).
      if (!ids.has(id) || checking.has(id)) {
        clearDownloadableSlotButtons(slot);
        return;
      }
      if (!slot.querySelector("a.file-download")) {
        const link = document.createElement("a");
        link.className = "btn-icon file-download";
        link.href = `/api/torrent-files/${id}/download`;
        link.title = "Скачать файл";
        link.setAttribute("download", "");
        link.innerHTML = _DOWNLOAD_ICON;
        slot.insertBefore(link, slot.firstChild);
      }
      ensureCopyPathButton(slot);
      ensureEncoderButton(slot);
      ensureMediaInfoButton(slot);
      ensureFileEncodeCheckbox(li, id);
    });
    syncTorrentEncodeSelectActions(block.closest(".torrent-files") || block);
    updateEncoderBatchBar();
  }

  function probeResultIsEmpty(data) {
    if (!data) return true;
    return !(data.file_ids || []).length && !(data.checking_ids || []).length;
  }

  function cacheDownloadableProbe(hash, data) {
    if (!hash || !data) return;
    // Пустой ответ не кэшируем — иначе блокируем повторный probe на том же DOM.
    if (probeResultIsEmpty(data)) {
      _downloadProbeCache.delete(hash);
      return;
    }
    _downloadProbeCache.set(hash, {
      file_ids: data.file_ids || [],
      checking_ids: data.checking_ids || [],
      ts: Date.now(),
    });
  }

  function cachedDownloadableProbe(hash) {
    const hit = _downloadProbeCache.get(hash);
    if (!hit) return null;
    if (Date.now() - hit.ts > _DOWNLOAD_PROBE_TTL_MS) return null;
    if (probeResultIsEmpty(hit)) return null;
    return hit;
  }

  function clearDownloadQueued(blocks) {
    (blocks || []).forEach((el) => {
      if (el && el.removeAttribute) el.removeAttribute("data-download-queued");
    });
  }

  function enqueueDownloadableChecks(root) {
    const scope = root || document;
    scope.querySelectorAll(".file-download-slot[data-file-id]").forEach((slot) => {
      // MediaInfo / copy / encoder — только для downloadable (как «Скачать»).
      if (slot.querySelector("a.file-download")) {
        ensureCopyPathButton(slot);
        ensureEncoderButton(slot);
        ensureMediaInfoButton(slot);
        const li = slot.closest("li[data-file-id]");
        ensureFileEncodeCheckbox(li, slot.getAttribute("data-file-id"));
      }
    });
    scope.querySelectorAll(".torrent-files").forEach((block) => {
      syncTorrentEncodeSelectActions(block);
    });
    updateEncoderBatchBar();
    scope.querySelectorAll(
      ".torrent-files[data-download-check]:not([data-download-queued]), .torrent-files-loaded[data-download-check]:not([data-download-queued])"
    ).forEach((el) => {
      el.setAttribute("data-download-queued", "1");
      const hash = el.getAttribute("data-download-check");
      const cached = hash ? cachedDownloadableProbe(hash) : null;
      if (cached) {
        applyDownloadableProbe(el, cached);
        // checking / refresh — всё равно догрузим свежие флаги.
        if (el.getAttribute("data-download-refresh") !== "1") return;
      }
      _downloadCheckQueue.push(el);
    });
    pumpDownloadableQueue();
  }

  function chunkHashes(hashes, size) {
    const out = [];
    for (let i = 0; i < hashes.length; i += size) out.push(hashes.slice(i, i + size));
    return out;
  }

  async function postDownloadableProbe(hashes, refresh, byHash) {
    if (!hashes.length) return;
    const chunks = chunkHashes(hashes, _DOWNLOAD_PROBE_CHUNK);
    for (const chunk of chunks) {
      const chunkBlocks = [];
      chunk.forEach((hash) => {
        (byHash.get(hash) || []).forEach((block) => chunkBlocks.push(block));
      });
      try {
        const resp = await fetch("/api/torrents/downloadable-files", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ hashes: chunk, refresh: !!refresh }),
        });
        if (!resp.ok) {
          clearDownloadQueued(chunkBlocks);
          continue;
        }
        const payload = await resp.json();
        (payload.items || []).forEach((item) => {
          const hash = item.info_hash;
          if (!hash) return;
          cacheDownloadableProbe(hash, item);
          (byHash.get(hash) || []).forEach((block) => {
            applyDownloadableProbe(block, item);
            // Пустой ответ — не блокируем повторный enqueue (Hash backfill / retry).
            if (probeResultIsEmpty(item)) {
              block.removeAttribute("data-download-queued");
            }
          });
        });
      } catch (_) {
        clearDownloadQueued(chunkBlocks);
      }
    }
  }

  async function pumpDownloadableQueue() {
    if (_downloadCheckBusy) return;
    _downloadCheckBusy = true;
    while (_downloadCheckQueue.length) {
      const batch = _downloadCheckQueue.splice(0, _downloadCheckQueue.length);
      const byHash = new Map();
      const refreshHashes = [];
      const dbOnlyHashes = [];
      const seenRefresh = new Set();
      const seenDb = new Set();
      batch.forEach((block) => {
        const hash = block.getAttribute("data-download-check");
        if (!hash) return;
        if (!byHash.has(hash)) byHash.set(hash, []);
        byHash.get(hash).push(block);
      });
      byHash.forEach((blocks, hash) => {
        const wantRefresh = blocks.some((b) => b.getAttribute("data-download-refresh") === "1");
        if (wantRefresh) {
          if (!seenRefresh.has(hash)) {
            seenRefresh.add(hash);
            refreshHashes.push(hash);
          }
        } else if (!seenDb.has(hash)) {
          seenDb.add(hash);
          dbOnlyHashes.push(hash);
        }
      });
      // refresh не должен заражать весь батч: две группы запросов.
      await postDownloadableProbe(refreshHashes, true, byHash);
      await postDownloadableProbe(dbOnlyHashes, false, byHash);
    }
    _downloadCheckBusy = false;
  }

  // Название релиза в <summary>: выделение текста без toggle details.
  // Клик по .release-title / .release-name не раскрывает ряд (в т.ч. 1-й клик
  // двойного клика). Toggle — по .release-meta / пустой зоне summary.
  document.addEventListener("click", (event) => {
    const summary = event.target.closest("summary.release-summary");
    if (!summary) return;
    if (event.target.closest("button, a, input, label")) return;
    if (event.target.closest(".release-name, .release-title")) {
      event.preventDefault();
      return;
    }
    const selection = window.getSelection();
    const hasRange =
      selection &&
      selection.type === "Range" &&
      String(selection).length > 0;
    if (hasRange || event.detail > 1) {
      event.preventDefault();
    }
  });

  document.addEventListener("DOMContentLoaded", () => {
    formatLocalTimes();
    enqueueDownloadableChecks();
    initUiSse();
  });
  document.body.addEventListener("htmx:afterSwap", (event) => {
    formatLocalTimes(event.detail.target);
    enqueueDownloadableChecks(event.detail.target);
    const target = event.detail.target;
    if (target && target.id === "job-detail-live") {
      const marker = target.querySelector("[data-selected-job-status]");
      if (marker) {
        target.setAttribute(
          "data-job-status",
          marker.getAttribute("data-selected-job-status") || ""
        );
      }
    }
    const sel = target && target.id ? `#${target.id}` : null;
    if (sel && _uiSsePreserveByTarget.has(sel)) {
      restoreUiSsePreserve(target, _uiSsePreserveByTarget.get(sel));
      _uiSsePreserveByTarget.delete(sel);
    }
  });

  let _uiSseSource = null;
  let _uiSseChannels = [];
  let _uiSseRefreshing = new Set();
  const _uiSsePreserveByTarget = new Map();

  function captureUiSsePreserve(root) {
    const scope = root || document;
    const openKeys = [...scope.querySelectorAll("details[open][data-sse-key]")].map(
      (el) => el.getAttribute("data-sse-key")
    );
    const lazyBodies = {};
    const encodeChecked = {};
    scope.querySelectorAll("details.torrent-files[data-sse-key]").forEach((details) => {
      const key = details.getAttribute("data-sse-key");
      if (!key) return;
      const body = details.querySelector(":scope > .torrent-files-body");
      if (body && body.querySelector(".torrent-files-loaded, .file-list")) {
        lazyBodies[key] = body.innerHTML;
      }
      const checkedIds = [...details.querySelectorAll(".file-encode-check:checked")]
        .map((el) => el.getAttribute("data-file-id"))
        .filter(Boolean);
      if (checkedIds.length) {
        encodeChecked[key] = checkedIds;
      }
    });
    return {
      scrollY: window.scrollY,
      openKeys,
      lazyBodies,
      encodeChecked,
    };
  }

  function restoreUiSsePreserve(root, state) {
    if (!state) return;
    const scope = root || document;
    const lazyBodies = state.lazyBodies || {};
    const encodeChecked = state.encodeChecked || {};
    (state.openKeys || []).forEach((key) => {
      const el = scope.querySelector(`details[data-sse-key="${cssAttrQuote(key)}"]`);
      if (!el) return;
      const savedHtml = lazyBodies[key];
      if (savedHtml) {
        const body = el.querySelector(":scope > .torrent-files-body");
        if (body) {
          body.innerHTML = savedHtml;
          // Сначала снимаем lazy-триггеры, иначе open=true снова дернёт hx-get.
          body.removeAttribute("hx-get");
          body.removeAttribute("hx-trigger");
          if (window.htmx) htmx.process(body);
          if (typeof enqueueDownloadableChecks === "function") {
            enqueueDownloadableChecks(el);
          }
        }
      }
      el.open = true;
      const checked = encodeChecked[key] || [];
      if (checked.length) {
        checked.forEach((fileId) => {
          const box = el.querySelector(
            `.file-encode-check[data-file-id="${cssAttrQuote(fileId)}"]`
          );
          if (box) box.checked = true;
        });
        if (typeof updateEncoderBatchBar === "function") updateEncoderBatchBar();
        if (typeof syncTorrentEncodeSelectActions === "function") {
          syncTorrentEncodeSelectActions(el);
        }
      }
    });
    window.scrollTo(0, state.scrollY || 0);
  }

  function cssAttrQuote(value) {
    return String(value).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
  }

  function refreshUiSseTargets(channel) {
    if (document.visibilityState !== "visible") return;
    const scrollY = window.scrollY;
    const activeJobStatuses = new Set(["pending", "running", "stopping"]);
    document.querySelectorAll(`[data-ui-sse-channel="${cssAttrQuote(channel)}"]`).forEach((el) => {
      if (el.getAttribute("data-ui-sse-active-only") === "1") {
        const jobStatus = (el.getAttribute("data-job-status") || "").toLowerCase();
        // Финальный джоб: не тянем логи/детали на каждый jobs-event.
        if (!activeJobStatuses.has(jobStatus)) return;
      }
      const url = el.getAttribute("data-ui-sse-url");
      const targetSel = el.getAttribute("data-ui-sse-target") || (el.id ? `#${el.id}` : null);
      if (!url || !targetSel) return;
      const key = `${channel}|${targetSel}|${url}`;
      if (_uiSseRefreshing.has(key)) return;
      _uiSseRefreshing.add(key);
      const preserved = captureUiSsePreserve(el);
      preserved.scrollY = scrollY;
      _uiSsePreserveByTarget.set(targetSel, preserved);
      htmx.ajax("GET", url, {
        target: targetSel,
        swap: "innerHTML settle:0 show:none",
      });
      // Не чаще ~3 с на один target (согласовано с ui_events._POLL_INTERVAL_SEC).
      setTimeout(() => _uiSseRefreshing.delete(key), 3000);
    });
  }

  function initUiSse() {
    const nodes = [...document.querySelectorAll("[data-ui-sse-channel]")];
    if (!nodes.length || typeof EventSource === "undefined") return;
    const channels = [...new Set(nodes.map((n) => n.getAttribute("data-ui-sse-channel")).filter(Boolean))];
    if (!channels.length) return;
    _uiSseChannels = channels;
    const url = `/ui/events?channels=${encodeURIComponent(channels.join(","))}`;
    if (_uiSseSource) {
      _uiSseSource.close();
      _uiSseSource = null;
    }
    const es = new EventSource(url);
    _uiSseSource = es;
    channels.forEach((ch) => {
      es.addEventListener(ch, () => refreshUiSseTargets(ch));
    });
    es.onerror = () => {
      /* браузер сам переподключится */
    };
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !_uiSseChannels.length) return;
    // Пока вкладка была скрыта, события могли пройти мимо — один refresh при возврате.
    _uiSseChannels.forEach((ch) => refreshUiSseTargets(ch));
  });
  </script>
</body>
</html>
